name: CI capacity diagnostic (not qualification)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci-capacity-diagnostic.yml
      - .github/labs/ci-capacity/**
    types: [opened]

permissions:
  contents: read

concurrency:
  group: ci-capacity-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  capacity:
    name: Capacity ${{ matrix.scenario }} (diagnostic only)
    if: >-
      github.repository == 'morecoffeyplease/firstmate' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.run_attempt == 1 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'fm/ci-capacity-design' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        scenario: [baseline, serial]
    env:
      CI: true
      LC_ALL: C
      LAB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      LAB_MERGE_SHA: ${{ github.sha }}
      LAB_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      LAB_SCENARIO: ${{ matrix.scenario }}
      SOURCE_COMMIT: 7153157693fbc4fccad7ae1e5cebed4800341d4c
    steps:
      - name: Start bounded outer-job clock
        env:
          LAB_ADMISSION_REPOSITORY: ${{ github.repository }}
          LAB_ADMISSION_EVENT: ${{ github.event_name }}
          LAB_ADMISSION_ACTION: ${{ github.event.action }}
          LAB_ADMISSION_ATTEMPT: ${{ github.run_attempt }}
          LAB_ADMISSION_BASE: ${{ github.event.pull_request.base.ref }}
          LAB_ADMISSION_DRAFT: ${{ github.event.pull_request.draft }}
          LAB_ADMISSION_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LAB_ADMISSION_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          LAB_ADMISSION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LAB_ADMISSION_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          run_root="$RUNNER_TEMP/fm-capacity/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$LAB_SCENARIO"
          job_phase=job-bootstrap
          if ! mkdir -p "$run_root"; then
            printf 'could not create diagnostic evidence directory: %s\n' "$run_root" >&2
            exit 2
          fi
          printf 'phase=job-bootstrap\noutcome=in-progress\n' > "$run_root/job-status.txt"
          date -u '+%Y-%m-%dT%H:%M:%SZ\tjob-bootstrap\tin-progress' \
            >> "$run_root/phase-journal.tsv"
          python3 - "$run_root" <<'PY'
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path(sys.argv[1])
          wall_ns = time.time_ns()
          monotonic_ns = time.monotonic_ns()
          (root / 'job-start-utc.txt').write_text(
              datetime.fromtimestamp(wall_ns / 1_000_000_000, timezone.utc).isoformat() + '\n')
          (root / 'job-start-epoch.txt').write_text(f'{wall_ns / 1_000_000_000:.9f}\n')
          (root / 'job-start-monotonic-ns.txt').write_text(f'{monotonic_ns}\n')
          PY
          python3 - "$run_root/lifecycle-journal.tsv" <<'PY'
          import os
          import sys
          import time
          descriptor = os.open(sys.argv[1], os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          try:
              os.write(descriptor, f'{time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}\tPREPARE\tjob started\n'.encode())
              os.fsync(descriptor)
          finally:
              os.close(descriptor)
          directory = os.open(sys.argv[1].rsplit('/', 1)[0], os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC)
          try:
              os.fsync(directory)
          finally:
              os.close(directory)
          PY
          finish_job_bootstrap() {
            status=$?
            trap - EXIT
            printf 'phase=%s\nexit=%s\n' "$job_phase" "$status" \
              > "$run_root/job-status.txt.tmp" 2>/dev/null || true
            mv "$run_root/job-status.txt.tmp" "$run_root/job-status.txt" 2>/dev/null || true
            printf '%s\t%s\texit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
              "$job_phase" "$status" >> "$run_root/phase-journal.tsv" 2>/dev/null || true
            exit "$status"
          }
          trap finish_job_bootstrap EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          job_phase=admission-before-checkout
          python3 - "$GITHUB_EVENT_PATH" "$run_root/admission-before-checkout.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          pull = payload.get('pull_request') or {}
          head = pull.get('head') or {}
          head_repo = head.get('repo') or {}
          base = pull.get('base') or {}
          checks = {
              'repository': os.environ.get('LAB_ADMISSION_REPOSITORY') == 'morecoffeyplease/firstmate',
              'event_name': os.environ.get('LAB_ADMISSION_EVENT') == 'pull_request',
              'event_action': os.environ.get('LAB_ADMISSION_ACTION') == 'opened' and payload.get('action') == 'opened',
              'run_attempt': os.environ.get('LAB_ADMISSION_ATTEMPT') == '1',
              'base_ref': os.environ.get('LAB_ADMISSION_BASE') == 'main' and base.get('ref') == 'main',
              'draft': os.environ.get('LAB_ADMISSION_DRAFT') == 'true' and pull.get('draft') is True,
              'head_ref': os.environ.get('LAB_ADMISSION_HEAD_REF') == 'fm/ci-capacity-design' and head.get('ref') == 'fm/ci-capacity-design',
              'head_repository': os.environ.get('LAB_ADMISSION_HEAD_REPOSITORY') == 'morecoffeyplease/firstmate' and head_repo.get('full_name') == 'morecoffeyplease/firstmate',
              'head_sha': os.environ.get('LAB_ADMISSION_HEAD_SHA') == os.environ.get('LAB_HEAD_SHA') and head.get('sha') == os.environ.get('LAB_HEAD_SHA'),
              'pull_request_number': os.environ.get('LAB_ADMISSION_NUMBER') == os.environ.get('LAB_PULL_REQUEST_NUMBER') and str(pull.get('number', '')) == os.environ.get('LAB_PULL_REQUEST_NUMBER'),
          }
          result = {'checks': checks, 'admitted': all(checks.values()), 'run_id': os.environ.get('GITHUB_RUN_ID'), 'attempt': os.environ.get('GITHUB_RUN_ATTEMPT')}
          Path(sys.argv[2]).write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          if not result['admitted']:
              raise SystemExit('diagnostic admission refused')
          PY
          job_phase=clock-start-recorded
          printf 'workflow=%s\nrun_id=%s\nrun_attempt=%s\nevent=%s\nscenario=%s\n' \
            "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$GITHUB_EVENT_NAME" "$LAB_SCENARIO" \
            > "$run_root/run-identity.txt"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 7153157693fbc4fccad7ae1e5cebed4800341d4c
          path: source-git
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare and verify immutable source and pinned tools
        id: prepare
        timeout-minutes: 8
        env:
          SOURCE_GIT_ROOT: ${{ github.workspace }}/source-git
          LAB_RECIPE_ROOT: ${{ github.workspace }}/.github/labs/ci-capacity
        run: .github/labs/ci-capacity/prepare.sh
      - name: Check one-minute fixture readiness
        id: readiness
        if: steps.prepare.outcome == 'success'
        timeout-minutes: 1
        env:
          LAB_SCENARIO: ${{ matrix.scenario }}
        run: python3 .github/labs/ci-capacity/readiness_gate.py pre-fixture
      - name: Run bounded Linux tracer fixtures
        id: fixtures
        if: steps.prepare.outcome == 'success' && steps.readiness.outcome == 'success'
        timeout-minutes: 1
        env:
          LAB_RECIPE_ROOT: ${{ github.workspace }}/.github/labs/ci-capacity
          LAB_RUN_ROOT: ${{ runner.temp }}/fm-capacity/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.scenario }}
        run: python3 .github/labs/ci-capacity/fixture-check.py
      - name: Measure full lint owner
        if: steps.prepare.outcome == 'success' && steps.readiness.outcome == 'success' && steps.fixtures.outcome == 'success'
        timeout-minutes: 45
        env:
          LAB_RECIPE_ROOT: ${{ github.workspace }}/.github/labs/ci-capacity
        run: .github/labs/ci-capacity/run-analysis.sh
      - name: Upload complete diagnostic evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: ci-capacity-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fm-capacity/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.scenario }}
          if-no-files-found: error
          retention-days: 30
